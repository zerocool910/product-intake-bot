# Brand table — mirror of docs/brand-pricing-reference.md.
#
# Names, codes and rates mirror globaltimecollection-accounting's
# database/seeders/BrandSeeder.php (checked 2026-11-13 at 4634f6b). `name`
# must match exactly: the importer looks brands up by name only.
#
# Pricing fields are used only for the confirm-time preview; the accounting app's Brand::priceBreakdown()
# is the source of truth on import.
#
# scheme:
#   list — staff type HLB (distributor list price). HBB = HLB × Π(1 − d). HJB = HLB.
#   nett — staff type HBB (cost).                   HJB = HBB × (1 + markup).
#   sale — no formula; staff type the selling price by hand.
# code:                the brand's short code; printed as {Brand} in the name unless
#                      print_code_on_tag is false. Null means the full name is printed.
# print_code_on_tag:   default true. False prints the full name even when a code exists
#                      (accounting's Brand::printedCode()). The owner can flip this per
#                      brand on the accounting /brands screen; if they do, mirror it here.
# uses_generated_sku:  AC/EXP/CA — owner-invented ref_code, SKU built from attributes.
#                      Everyone else — manufacturer SKU used directly.
# kind:                default item type for the brand (watch | clock).
# aliases:             extra words staff may type in a caption.

brands:
  # --- List scheme ---
  - {name: Alexandre Christie, code: AC, scheme: list, purchase_discounts: [0.47, 0.10], uses_generated_sku: true, aliases: [alexandre]}
  - {name: Expedition, code: EXP, scheme: list, purchase_discounts: [0.50, 0.10], uses_generated_sku: true, aliases: [exp]}
  - {name: Christophe Arden, code: CA, scheme: list, purchase_discounts: [0.50, 0.10], uses_generated_sku: true, aliases: [arden]}
  - {name: Seiko, code: SK, print_code_on_tag: false, scheme: list, purchase_discounts: [0.30, 0.03, 0.02]}  # watches and clocks ("Seiko JD" retired)
  - {name: Alba, code: AL, scheme: list, purchase_discounts: [0.30, 0.03, 0.02]}
  - {name: Aigner, code: AIG, scheme: list, purchase_discounts: [0.40]}
  - {name: Casio, code: CS, print_code_on_tag: false, scheme: list, purchase_discounts: [0.42]}
  - {name: Guess, code: GS, scheme: list, purchase_discounts: [0.35]}

  # --- Nett scheme ---
  - {name: Bonia, code: BN, scheme: nett, markup: 0.50}
  - {name: Timberland, code: TBL, scheme: nett, markup: 0.50}
  - {name: Sezen, code: SZ, scheme: nett, markup: 0.50}
  - {name: Digitec, code: DG, scheme: nett, markup: 0.50}
  - {name: Jean Michelle, code: JM, scheme: nett, markup: 0.50}
  - {name: Lobor, code: LB, scheme: nett, markup: 0.50}
  - {name: Hush Puppies, code: HP, scheme: nett, markup: 0.50}
  - {name: Caterpillar, code: CAT, scheme: nett, markup: 0.50}
  - {name: Condotti, code: CN, scheme: nett, markup: 0.50}
  - {name: Wishkey, code: WK, scheme: nett, markup: 0.50}
  - {name: Mirage, code: MRG, scheme: nett, markup: 0.50}
  - {name: Smartwatch (non-Huawei), code: SM, scheme: nett, markup: 0.70, aliases: [smartwatch]}
  - {name: Smartwatch (Huawei), code: null, scheme: nett, markup: 0.50, aliases: [huawei, smartwatch huawei, huawei smartwatch]}

  # --- SALE (no formula, clearance terms) ---
  - {name: Police, code: null, scheme: sale}
  - {name: Alain Delon, code: null, scheme: sale}
  - {name: Hummer, code: null, scheme: sale}
  - {name: Charles Jourdan, code: null, scheme: sale}
  - {name: Festina, code: null, scheme: sale}
  - {name: Christ Verra, code: null, scheme: sale}
  - {name: Lee Cooper, code: null, scheme: sale}
